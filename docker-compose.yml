services:
  server:
    build: ./server
    # Published on a normal bridge network so the web container can reach it by
    # service name. LAN mDNS device auto-discovery needs host networking instead
    # — see docker-compose.host-net.yml.
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/data
    environment:
      - DATABASE_URL=/app/data/hookbot.db
      - FIRMWARE_DIR=/app/data/firmware
      - BIND_ADDR=0.0.0.0:3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db-data:
