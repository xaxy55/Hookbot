server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to backend
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vite fingerprints these filenames, so a given URL's contents never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. Everything here resolves to index.html, which names the
    # fingerprinted bundles, so it must never be cached: otherwise a browser
    # keeps loading the previous deploy's JS long after an update and a fixed
    # bug still reproduces. Note this has to live on `location /` rather than
    # `location = /index.html` — a request for "/" is served by nginx's internal
    # index lookup, which never enters the exact-match block.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
