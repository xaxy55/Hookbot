<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Hookbot: the desk companion's face, matching the OLED avatar
       (rounded head, two eyes, a flat mouth) in the app's brand red. -->
  <rect width="48" height="48" rx="11" fill="#ef4444"/>
  <!-- antenna -->
  <line x1="24" y1="6" x2="24" y2="12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="5" r="2.5" fill="#fff"/>
  <!-- head -->
  <rect x="9" y="12" width="30" height="25" rx="7" fill="#fff"/>
  <!-- eyes -->
  <rect x="15" y="19" width="6" height="9" rx="3" fill="#ef4444"/>
  <rect x="27" y="19" width="6" height="9" rx="3" fill="#ef4444"/>
  <!-- mouth -->
  <rect x="18" y="31" width="12" height="2.5" rx="1.25" fill="#ef4444"/>
</svg>
