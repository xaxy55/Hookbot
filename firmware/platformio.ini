; PlatformIO Project Configuration
; Hookbot - ESP32 Claude Code Companion

; ─── Default: ESP32 + SSD1306 OLED ────────────────────────────────
[env:esp32]
; The default management server is read from the HOOKBOT_MGMT_SERVER environment
; variable — the repo is public, so no hostname is committed here. Leave it unset
; for a LAN-only build (an empty value disables cloud mode); set it before
; building a hosted device:
;   HOOKBOT_MGMT_SERVER=https://your-server.example pio run -e xiao-c6-gc9a01
; It can also be changed at runtime via POST /config {"mgmt_server": "..."}.
;
; Pinned: the pioarduino platform used by xiao-c6-gc9a01 is also named
; "espressif32" with a much higher version, so an unpinned spec resolves to it
; and overflows IRAM on the classic ESP32.
platform = espressif32@^6.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    fastled/FastLED@^3.7.0
    me-no-dev/ESPAsyncWebServer@^1.2.4
    me-no-dev/AsyncTCP@^1.1.1
    bblanchon/ArduinoJson@^7.2.0
    madhephaestus/ESP32Servo@^3.0.5
    ricmoo/QRCode@^0.0.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DNO_SOUND
    -DDEFAULT_MGMT_SERVER='"${sysenv.HOOKBOT_MGMT_SERVER}"'
    ; I2S audio enabled by default — define NO_AUDIO to disable
    ; Requires INMP441 mic + MAX98357A DAC wired to I2S pins (see audio.h)

; ─── ESP32-4848S040C: 4.0" 480x480 Capacitive Touch LCD ─────────
[env:esp32-4848s040c]
platform = espressif32@^6.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.arduino.memory_type = dio_opi

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=1
    -DBOARD_ESP32_4848S040C
    -DNO_SOUND
    -DNO_LED
    -DNO_AUDIO
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DDEFAULT_MGMT_SERVER='"${sysenv.HOOKBOT_MGMT_SERVER}"'

lib_deps =
    lovyan03/LovyanGFX@^1.1.12
    mathieucarbou/ESPAsyncWebServer@^3.3.0
    bblanchon/ArduinoJson@^7.2.0
    madhephaestus/ESP32Servo@^3.0.5
    ricmoo/QRCode@^0.0.1

; ─── Seeed XIAO ESP32-C6 + GC9A01: 1.28" 240x240 round SPI LCD ──
; Needs Arduino-ESP32 3.x for ESP32-C6, which the official espressif32
; platform does not ship — hence the pioarduino fork below.
;
; IMPORTANT: build this env with `make firmware-c6`, not a bare `pio run`.
; Both platforms install a package named framework-arduinoespressif32 at
; different versions into the same shared directory, so building this env and
; an espressif32 env against one PlatformIO core dir makes them clobber each
; other. The make target points PLATFORMIO_CORE_DIR at a separate store.
[env:xiao-c6-gc9a01]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_c6_ota.csv

build_flags =
    ; Debug level 0 (not 1 like the other envs) — this board is flash-tight
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -DBOARD_XIAO_C6_GC9A01
    -DNO_SOUND
    -DNO_LED
    -DNO_AUDIO
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEFAULT_MGMT_SERVER='"${sysenv.HOOKBOT_MGMT_SERVER}"'

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    mathieucarbou/ESPAsyncWebServer@^3.3.0
    bblanchon/ArduinoJson@^7.2.0
    madhephaestus/ESP32Servo@^3.0.6
    ricmoo/QRCode@^0.0.1
